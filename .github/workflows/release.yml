name: Publish v2.1.0 release

on:
  create:

permissions:
  contents: write

jobs:
  publish:
    if: github.event.ref_type == 'branch' && github.event.ref == 'release/v2.1.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test
        run: |
          python -m py_compile chd_batch_converter.py
          python -m unittest discover -s tests -v
      - name: Build and verify release archive
        run: bash assemble_release.sh
      - name: Publish GitHub Release and attach ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v2.1.0 \
            dist/CHD_Batch_Converter_Linux_v2.1.0.zip \
            --target main \
            --title "CHD Batch Converter 2.1.0" \
            --notes-file RELEASE_NOTES_v2.1.0.md
